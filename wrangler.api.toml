name = "gemini-proxy-lms"
main = "workers/gateway.mjs"
compatibility_date = "2026-11-16"
workers_dev = true
preview_urls = false

[vars]
FIREBASE_PROJECT_ID = "my-lms-project-13739"
OWNER_UID = "1qhlWSbqAxd1dAvo2Nw92gdJhNk1"
# Confirmed site: https://msleaderindustry-hue.github.io/Test-LMS/
# CORS takes the origin only, without the repository path.
ALLOWED_ORIGINS = "https://msleaderindustry-hue.github.io"
GEMINI_MODEL = "gemini-3.5-flash-lite"
BACKUP_STORAGE = "firestore"
APP_RELEASE = "20261119-admin1"

[[durable_objects.bindings]]
name = "LMS_RUNTIME"
class_name = "LmsRuntime"

[[migrations]]
tag = "lms-runtime-v1"
new_sqlite_classes = ["LmsRuntime"]

[triggers]
crons = ["*/5 * * * *"]

[[services]]
binding = "DISCORD_SERVICE"
service = "discordwebhook"

[[queues.producers]]
binding = "JOBS"
queue = "test-lms-jobs"

[[queues.consumers]]
queue = "test-lms-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 5
max_concurrency = 1
dead_letter_queue = "test-lms-jobs-failed"

[observability]
enabled = true

# Keep default plan limits. A custom Worker CPU limit requires Workers Paid;
# heavy work uses the SQLite Durable Object's default 30-second allowance.
